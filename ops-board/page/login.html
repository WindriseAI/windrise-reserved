<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E4E8EC">
<meta name="robots" content="noindex, nofollow">
<title>风桥运营看板</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<main class="login">
  <form class="card login-card" method="post" action="login">
    <h1 class="title">风桥运营看板</h1>
    <div class="login-field">
      <label class="login-label" for="username">账号</label>
      <input class="login-input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="login-field">
      <label class="login-label" for="password">密码</label>
      <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <label class="login-remember"><input type="checkbox" name="remember" value="1" checked>记住我（一年）</label>
    <!--LOGIN_MESSAGE-->
    <button class="login-btn" type="submit">登录</button>
  </form>
</main>
</body>
</html>
