<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windrise AI · Reserved</title>
<style>
  :root{
    --bg:#0a0d14; --fg:#e8ecf4; --muted:#8b94a7; --accent:#5eead4; --line:#1c2333;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%, #10203a 0%, var(--bg) 55%) fixed;
    color:var(--fg);display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;overflow:hidden;
  }
  /* subtle grid */
  body::before{
    content:"";position:fixed;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;opacity:.25;mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 70%);
    pointer-events:none;
  }
  .card{
    position:relative;text-align:center;max-width:640px;width:100%;
    padding:56px 40px;border:1px solid var(--line);border-radius:24px;
    background:linear-gradient(180deg,rgba(20,27,42,.72),rgba(12,16,26,.72));
    backdrop-filter:blur(14px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    border:1px solid rgba(94,234,212,.3);background:rgba(94,234,212,.06);
    padding:7px 14px;border-radius:999px;margin-bottom:28px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  h1 .grad{background:linear-gradient(90deg,#5eead4,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{margin-top:18px;color:var(--muted);font-size:16px;line-height:1.7}
  .meta{margin-top:34px;display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .meta span b{color:var(--fg);font-weight:600}
  .foot{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:#4a5468}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span>Server Reserved · 运行中</div>
    <h1>Windrise&nbsp;<span class="grad">AI</span></h1>
    <p class="sub">
      这台服务器已被预留，正在为你守护。<br>
      This server is reserved and standing by.
    </p>
    <div class="meta">
      <span>状态 <b>Online</b></span>
      <span>区域 <b>US East</b></span>
      <span>规格 <b>0.5 vCPU · 1 GB</b></span>
    </div>
  </main>
  <div class="foot">Windrise AI · Reserved Instance</div>
</body>
</html>
